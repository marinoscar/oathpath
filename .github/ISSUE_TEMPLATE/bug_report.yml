name: Bug
description: Something behaves incorrectly. File before starting the fix.
title: "fix(<scope>): "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Search first — reuse an existing issue rather than filing a duplicate.
        Reference this issue from the commit or pull request (`Fixes #123`).
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is wrong. One or two sentences.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include the error, the failing assertion, or the wrong value.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      multiple: true
      options:
        - API
        - Web
        - Database
        - CLI
        - Infrastructure
        - Documentation
        - Tests
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and logs
      description: >
        Where it happens (local compose, deployed VPS, CI), the commit if known,
        and any relevant log output.
      render: shell
