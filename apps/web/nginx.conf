# =============================================================================
# Nginx config baked into the web production image
# =============================================================================
# THE LISTEN PORT IS 5173 ON PURPOSE, AND IT IS NOT THE VITE DEV SERVER.
#
# This container is only ever reached from inside the compose network, by the
# proxy in infra/nginx/nginx.conf, whose `web_upstream` names `web:5173`. The
# port number is therefore arbitrary — nothing outside the network connects to
# it — and it is matched to the dev server's port so that ONE proxy config
# serves both modes.
#
# The alternative is a separate proxy config per mode, which means two copies
# of the SSE block, the security headers and the CSP, drifting apart the first
# time one of them is edited.
#
# Before "correcting" this to 80: `base.compose.yml + prod.compose.yml` used to
# have exactly that mismatch, and the result was a stack whose API answered
# normally while every page load returned 502.
# =============================================================================

server {
    listen 5173;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------------------------
    # The service worker must never be cached  (issue #359, epic #345)
    # -------------------------------------------------------------------------
    # THIS EXACT-MATCH BLOCK IS LOAD-BEARING, and it is the one nginx change
    # the PWA work needs. `/sw.js` ends in `.js`, so without it the rule below
    # stamps the service worker `public, immutable` for a year — and a browser
    # that will not re-fetch the worker can never discover that a new one
    # exists. The update flow (`src/sw/registerServiceWorker.ts`) would be dead
    # code on any client that had already installed once, and the only way back
    # would be the learner clearing site data: precisely the failure the update
    # flow exists to prevent.
    #
    # nginx gives an exact `location =` match priority over any regex location,
    # so this wins regardless of the order the two blocks appear in.
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # The manifest is emitted by the build (see `pwa()` in vite.config.ts) and
    # `.webmanifest` is not in nginx's default mime.types, so it would be served
    # as application/octet-stream. Chrome is lenient about that today; declaring
    # the right type costs three lines and removes the question.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
