<text x='45.0' y='660' font-size='10' fill='#2f6fed' text-anchor='middle' font-family='Helvetica, Arial, sans-serif'>Home</text>
<circle cx='135.0' cy='634' r='8' fill='none' stroke='#6b7280' stroke-width='2'/>
<text x='135.0' y='660' font-size='10' fill='#6b7280' text-anchor='middle' font-family='Helvetica, Arial, sans-serif'>Learn</text>
<circle cx='225.0' cy='634' r='8' fill='none' stroke='#6b7280' stroke-width='2'/>
<text x='225.0' y='660' font-size='10' fill='#6b7280' text-anchor='middle' font-family='Helvetica, Arial, sans-serif'>Practice</text>
<circle cx='315.0' cy='634' r='8' fill='none' stroke='#6b7280' stroke-width='2'/>
<text x='315.0' y='660' font-size='10' fill='#6b7280' text-anchor='middle' font-family='Helvetica, Arial, sans-serif'>Progress</text>
