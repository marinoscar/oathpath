</text>
<rect x='124' y='240' width='130' height='28' rx='6' fill='#2f6fed'/>
<text x='189' y='258' font-size='12' fill='#ffffff' text-anchor='middle' font-family='Helvetica, Arial, sans-serif'>Go to Learn</text>
<text x='564' y='260' font-size='9' fill='#6b7280' text-anchor='end' font-family='Helvetica, Arial, sans-serif'>(shown here: the interview-countdown state — see spec for orientation / explore)</text>
<circle cx='168' cy='353' r='48' fill='none' stroke='#d1d5db' stroke-width='8' stroke-dasharray='4,5'/>
<text x='168' y='351' font-size='11' fill='#6b7280' text-anchor='middle' font-family='Helvetica, Arial, sans-serif'>Not tracked</text>
<text x='168' y='367' font-size='11' fill='#6b7280' text-anchor='middle' font-family='Helvetica, Arial, sans-serif'>yet</text>
<text x='236' y='318' font-size='12' fill='#4b5563' font-weight='normal' font-family='Helvetica, Arial, sans-serif'>
<tspan x='236' dy='0'>Your daily goal will show here once practice</tspan>
<tspan x='236' dy='18'>sessions exist.</tspan>
</text>
<line x1='108' y1='610' x2='580' y2='610' stroke='#d1d5db'/>
<text x='108' y='630' font-size='10' fill='#6b7280' font-weight='normal' font-family='Helvetica, Arial, sans-serif'>
<tspan x='108' dy='0'>OathPath is not USCIS. This is our own assessment of your</tspan>
<tspan x='108' dy='18'>preparation — never an official determination.</tspan>
</text>
