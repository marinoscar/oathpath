<tspan x='124' dy='0'>12 days until your interview</tspan>
</text>
<text x='124' y='198' font-size='12' fill='#4b5563' font-weight='normal' font-family='Helvetica, Arial, sans-serif'>
<tspan x='124' dy='0'>Steady practice between now and then matters more than a</tspan>
