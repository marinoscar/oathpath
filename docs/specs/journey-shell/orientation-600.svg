<svg xmlns='http://www.w3.org/2000/svg' width='600' height='1420' viewBox='0 0 600 1420'>
<rect x='0' y='0' width='600' height='1420' fill='#ffffff'/>

<rect x='0' y='0' width='600' height='48' fill='#ffffff' stroke='#d1d5db' stroke-width='1'/>
<text x='16' y='30' font-size='14' fill='#1f2937' font-weight='bold' font-family='Helvetica, Arial, sans-serif'>OathPath</text>
<text x='584' y='30' font-size='12' fill='#2f6fed' text-anchor='end' font-family='Helvetica, Arial, sans-serif'>Sign out</text>
<text x='60' y='84' font-size='20' fill='#1f2937' font-weight='bold' font-family='Helvetica, Arial, sans-serif'>
<tspan x='60' dy='0'>Let's set up your plan</tspan>
</text>
<text x='60' y='114' font-size='12' fill='#4b5563' font-weight='normal' font-family='Helvetica, Arial, sans-serif'>
<tspan x='60' dy='0'>A few quick questions help us show you the right test, and a</tspan>
<tspan x='60' dy='18'>realistic countdown if you have an interview date. You can change</tspan>
<tspan x='60' dy='18'>any of this later in Settings.</tspan>
</text>
<text x='60' y='196' font-size='13' fill='#1f2937' font-weight='bold' font-family='Helvetica, Arial, sans-serif'>
<tspan x='60' dy='0'>When did you file your Form N-400?</tspan>
</text>
<rect x='60' y='220' width='480' height='30' rx='6' fill='#ffffff' stroke='#d1d5db'/>
<text x='70' y='240' font-size='12' fill='#4b5563' font-family='Helvetica, Arial, sans-serif'>MM / DD / YYYY</text>
<text x='60' y='266' font-size='11' fill='#6b7280' font-weight='normal' font-family='Helvetica, Arial, sans-serif'>
<tspan x='60' dy='0'>This tells us which civics test applies to you — the test changed for</tspan>
<tspan x='60' dy='18'>people who filed on or after October 20, 2025. We'll pick the right one</tspan>
<tspan x='60' dy='18'>for you automatically.</tspan>
</text>
<text x='60' y='342' font-size='13' fill='#1f2937' font-weight='bold' font-family='Helvetica, Arial, sans-serif'>
<tspan x='60' dy='0'>Are you 65 or older, with a green card for 20 years or more?</tspan>
</text>
<rect x='60' y='366' width='480' height='30' rx='6' fill='#ffffff' stroke='#d1d5db'/>
<text x='70' y='386' font-size='12' fill='#4b5563' font-family='Helvetica, Arial, sans-serif'>☐ Yes, both are true</text>
<text x='60' y='412' font-size='11' fill='#6b7280' font-weight='normal' font-family='Helvetica, Arial, sans-serif'>
<tspan x='60' dy='0'>If both are true, you may only need to know a shorter list of questions.</tspan>
<tspan x='60' dy='18'>Answer honestly — this changes what we ask you to practice.</tspan>
</text>
<text x='60' y='470' font-size='13' fill='#1f2937' font-weight='bold' font-family='Helvetica, Arial, sans-serif'>
<tspan x='60' dy='0'>Do you have an interview date yet? (Optional)</tspan>
</text>
<rect x='60' y='494' width='480' height='30' rx='6' fill='#ffffff' stroke='#d1d5db'/>
<text x='70' y='514' font-size='12' fill='#4b5563' font-family='Helvetica, Arial, sans-serif'>MM / DD / YYYY (optional)</text>
<text x='60' y='540' font-size='11' fill='#6b7280' font-weight='normal' font-family='Helvetica, Arial, sans-serif'>
<tspan x='60' dy='0'>If you don't have one yet, that's completely normal — leave this blank and</tspan>
<tspan x='60' dy='18'>add it later.</tspan>
</text>
<text x='60' y='598' font-size='13' fill='#1f2937' font-weight='bold' font-family='Helvetica, Arial, sans-serif'>
<tspan x='60' dy='0'>Which state or territory do you live in?</tspan>
</text>
<rect x='60' y='622' width='480' height='30' rx='6' fill='#ffffff' stroke='#d1d5db'/>
<text x='70' y='642' font-size='12' fill='#4b5563' font-family='Helvetica, Arial, sans-serif'>Select a state or territory</text>
<text x='60' y='668' font-size='11' fill='#6b7280' font-weight='normal' font-family='Helvetica, Arial, sans-serif'>
<tspan x='60' dy='0'>Some civics questions have answers that depend on where you live — like</tspan>
<tspan x='60' dy='18'>the name of your state's current governor.</tspan>
</text>
<text x='60' y='726' font-size='13' fill='#1f2937' font-weight='bold' font-family='Helvetica, Arial, sans-serif'>
<tspan x='60' dy='0'>How many minutes a day do you want to aim for?</tspan>
</text>
<rect x='60' y='750' width='480' height='30' rx='6' fill='#ffffff' stroke='#d1d5db'/>
<text x='70' y='770' font-size='12' fill='#4b5563' font-family='Helvetica, Arial, sans-serif'>5</text>
<text x='60' y='796' font-size='11' fill='#6b7280' font-weight='normal' font-family='Helvetica, Arial, sans-serif'>
<tspan x='60' dy='0'>Five minutes should matter. Start small — you can always do more, and a</tspan>
<tspan x='60' dy='18'>short streak beats a skipped week.</tspan>
</text>
<text x='60' y='854' font-size='13' fill='#1f2937' font-weight='bold' font-family='Helvetica, Arial, sans-serif'>
<tspan x='60' dy='0'>What language should we use to explain a tricky answer?</tspan>
</text>
<rect x='60' y='878' width='480' height='30' rx='6' fill='#ffffff' stroke='#d1d5db'/>
<text x='70' y='898' font-size='12' fill='#4b5563' font-family='Helvetica, Arial, sans-serif'>English</text>
<text x='60' y='924' font-size='11' fill='#6b7280' font-weight='normal' font-family='Helvetica, Arial, sans-serif'>
<tspan x='60' dy='0'>Questions and official answers stay in English — this is only for extra</tspan>
<tspan x='60' dy='18'>explanations, so it's easier to understand why an answer is correct.</tspan>
</text>
<rect x='60' y='990' width='180' height='38' rx='8' fill='#2f6fed'/>
<text x='150' y='1014' font-size='13' fill='#ffffff' text-anchor='middle' font-family='Helvetica, Arial, sans-serif'>Save and continue</text>
</svg>
