<text x='108' y='156' font-size='13' fill='#4b5563' font-weight='normal' font-family='Helvetica, Arial, sans-serif'>
<tspan x='108' dy='0'>This is where you'll see how ready you actually are — not</tspan>
<tspan x='108' dy='18'>just how many questions you've answered, but real evidence:</tspan>
<tspan x='108' dy='18'>what you remember, how consistently, and what's still shaky.</tspan>
</text>
<text x='108' y='232' font-size='13' fill='#4b5563' font-weight='normal' font-family='Helvetica, Arial, sans-serif'>
<tspan x='108' dy='0'>There's no evidence to show yet, because nothing here is</tspan>
<tspan x='108' dy='18'>tracked yet. That's the honest answer, and it's the one this</tspan>
<tspan x='108' dy='18'>page will always give until it has something real to show.</tspan>
</text>
